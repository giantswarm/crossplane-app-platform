[project]
name = "helmapp-wrap"
version = "0.1.0"
description = "Move a Flux HelmRelease under a HelmApp (docs/migration.md)"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
helmapp-wrap = "wrap:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["wrap.py"]
