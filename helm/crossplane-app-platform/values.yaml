# This file is a Helm values file for the crossplane-app-platform chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#
image:
  name: "giantswarm/crossplane-app-platform"
  tag: ""
registry:
  domain: gsoci.azurecr.io
helmController:
  # CEL health checks (healthCheckExprs, waitStrategy) need helm-controller >= v1.5.0. Off: no HelmRelease gets them,
  # and a HelmApp with spec.healthCheckExprs is refused.
  healthChecks: false
