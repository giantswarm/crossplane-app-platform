# Lets subjects bound to the Kubernetes default admin/edit/view roles in an org-* namespace
# use HelmApp there. Aggregation adds rules only; the namespace comes from the customer's
# RoleBinding, so nothing is granted outside it. See docs/customer-rbac.md.
{{- range $role, $verbs := dict "admin" (list "*") "edit" (list "*") "view" (list "get" "list" "watch") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "name" $ }}-helmapp-{{ $role }}
  labels:
    rbac.authorization.k8s.io/aggregate-to-{{ $role }}: "true"
    {{- include "labels.common" $ | nindent 4 }}
rules:
  - apiGroups: [apps.giantswarm.io]
    resources: [helmapps, helmapps/status]
    verbs: {{ $verbs | toJson }}
{{- end }}
