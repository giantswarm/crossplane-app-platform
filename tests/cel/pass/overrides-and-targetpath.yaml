apiVersion: apps.giantswarm.io/v1alpha1
kind: HelmApp
metadata: {name: x, namespace: org-acme}
spec:
  namespace: hello
  chart: {name: hello-world, version: "1.0.0", repository: "oci://example.com/charts"}
  targets: {static: [{cluster: a, valuesFrom: [{kind: Secret, name: s, targetPath: a.b}]}]}
  valuesFrom: [{kind: ConfigMap, name: c, targetPath: x}]
  helmReleaseOverrides: {releaseName: r, timeout: 10m, install: {remediation: {retries: 3}}}
