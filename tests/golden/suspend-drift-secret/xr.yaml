apiVersion: apps.giantswarm.io/v1alpha1
kind: HelmApp
metadata: {name: hello-world, namespace: org-acme}
spec:
  chart:
    name: hello-world
    repository: oci://registry.example.com/charts
    version: "1.2.3"
    secretRef: {name: registry-creds}
  targets:
    static: [{cluster: acme01}]
  namespace: hello
  driftDetection: {mode: enabled}
  suspend: true
