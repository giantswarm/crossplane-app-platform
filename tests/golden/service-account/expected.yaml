---
apiVersion: apps.giantswarm.io/v1alpha1
kind: HelmApp
metadata:
  name: hello
  namespace: org-acme
spec:
  crossplane:
    resourceRefs:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: hello
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: hello
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: rset, rsip'
    reason: Creating
    status: "False"
    type: Ready
  message: Waiting for the input provider.
  targets:
  - cluster: acme01
    message: ""
    ready: false
    version: ""
  - cluster: mc01
    message: ""
    ready: false
    version: ""
  version: ""
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  annotations:
    crossplane.io/composition-resource-name: rset
  labels:
    crossplane.io/composite: hello
  name: hello
  namespace: org-acme
  ownerReferences:
  - apiVersion: apps.giantswarm.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: HelmApp
    name: hello
    uid: accec6be-7e50-52c6-bcb2-07170227632c
spec:
  dependsOn:
  - apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSetInputProvider
    name: hello
    namespace: org-acme
    ready: true
    readyExpr: has(status.exportedInputs) && size(status.exportedInputs) > 0
  inputsFrom:
  - kind: ResourceSetInputProvider
    name: hello
  resources:
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: hello
      namespace: org-acme
    spec:
      interval: 5m
      ref:
        tag: << inputs.tag | quote >>
      url: oci://gsoci.azurecr.io/charts/giantswarm/hello-world
      verify:
        matchOIDCIdentity:
        - issuer: ^https://oidc\.circleci\.com$
          subject: ^https://circleci\.com/api/v2/projects/[a-f0-9-]+/pipeline-definitions/[a-f0-9-]+$
        provider: cosign
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: acme01-hello
      namespace: org-acme
    spec:
      chartRef:
        kind: OCIRepository
        name: hello
      driftDetection:
        mode: warn
      install:
        remediation:
          retries: 10
      interval: 5m
      kubeConfig:
        secretRef:
          name: acme01-kubeconfig
      releaseName: hello
      serviceAccountName: automation
      storageNamespace: hello
      targetNamespace: hello
      upgrade:
        remediation:
          retries: 10
          strategy: rollback
      valuesFrom:
      - kind: ConfigMap
        name: acme01-cluster-values
        optional: true
      - kind: ConfigMap
        name: acme01-hello-user-values
        optional: true
      - kind: Secret
        name: acme01-hello-user-values
        optional: true
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: mc01-hello
      namespace: org-acme
    spec:
      chartRef:
        kind: OCIRepository
        name: hello
      driftDetection:
        mode: warn
      install:
        remediation:
          retries: 10
      interval: 5m
      releaseName: hello
      serviceAccountName: automation
      upgrade:
        remediation:
          retries: 10
          strategy: rollback
  serviceAccountName: automation
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  annotations:
    crossplane.io/composition-resource-name: rsip
  labels:
    crossplane.io/composite: hello
  name: hello
  namespace: org-acme
  ownerReferences:
  - apiVersion: apps.giantswarm.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: HelmApp
    name: hello
    uid: accec6be-7e50-52c6-bcb2-07170227632c
spec:
  filter:
    semver: 3.2.4
  type: OCIArtifactTag
  url: oci://gsoci.azurecr.io/charts/giantswarm/hello-world
