  namespace: org-acme
spec:
  crossplane:
    resourceRefs:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: cluster-aws
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSet
      name: cluster-aws
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: rset, rsip'
    reason: Creating
    status: "False"
    type: Ready
  message: Waiting for the input provider.
  targets:
  - cluster: mc01
    message: ""
    ready: false
    version: ""
  version: ""
---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  annotations:
    crossplane.io/composition-resource-name: rset
  labels:
    crossplane.io/composite: cluster-aws
  name: cluster-aws
  namespace: org-acme
  ownerReferences:
  - apiVersion: apps.giantswarm.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: HelmApp
    name: cluster-aws
    uid: 164b610f-6f55-5072-8138-b05b7bc44b88
spec:
  dependsOn:
  - apiVersion: fluxcd.controlplane.io/v1
    kind: ResourceSetInputProvider
    name: cluster-aws
    ready: true
    readyExpr: has(status.exportedInputs) && size(status.exportedInputs) > 0
  inputsFrom:
  - kind: ResourceSetInputProvider
    name: cluster-aws
  resources:
  - apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      annotations:
        fluxcd.controlplane.io/prune: disabled
      name: cluster-aws
      namespace: org-acme
    spec:
      interval: 5m
      ref:
        tag: << inputs.tag | quote >>
      url: oci://gsoci.azurecr.io/charts/giantswarm/cluster-aws
      verify:
        matchOIDCIdentity:
        - issuer: ^https://oidc\.circleci\.com$
          subject: ^https://circleci\.com/api/v2/projects/[a-f0-9-]+/pipeline-definitions/[a-f0-9-]+$
        provider: cosign
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      annotations:
        fluxcd.controlplane.io/prune: disabled
      name: mc01-cluster-aws
      namespace: org-acme
    spec:
      chartRef:
        kind: OCIRepository
        name: cluster-aws
      driftDetection:
        mode: warn
      healthCheckExprs:
      - apiVersion: cluster.x-k8s.io/v1beta1
        current: status.phase == 'Provisioned'
        kind: Cluster
      install:
        remediation:
          retries: 10
      interval: 5m
      releaseName: cluster-aws
      upgrade:
        remediation:
          retries: 10
          strategy: rollback
      waitStrategy:
        name: poller
---
apiVersion: fluxcd.controlplane.io/v1
